name: smart_vision_journal
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Architecture & State Management
  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Offline-First & Local Storage
  sqflite: ^2.4.2
  path: ^1.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Networking & API
  dio: ^5.4.0
  flutter_dotenv: ^5.1.0

  # AI & Machine Learning
  google_mlkit_text_recognition: ^0.11.0
  image_picker: ^1.0.7

  # UI & Routing
  auto_route: ^7.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation & Testing
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1
  freezed: ^2.4.5
  freezed_annotation: ^2.4.1
  auto_route_generator: ^7.3.2
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    